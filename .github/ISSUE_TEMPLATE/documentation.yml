name: Documentation
description: Something confusing or missing in the docs?
title: "[Docs]: "
labels: ["docs", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Documentation confusing or missing something? Let's fix it - share what's unclear.

  - type: textarea
    id: problem
    attributes:
      label: What's unclear or missing?
      placeholder: I couldn't figure out how to...
    validations:
      required: true

  - type: dropdown
    id: doc-type
    attributes:
      label: What kind of docs?
      options:
        - README
        - Getting started
        - Commands
        - Examples
        - Templates
        - Troubleshooting
        - Not sure
        - Other
    validations:
      required: false

  - type: dropdown
    id: affected-area
    attributes:
      label: Which area?
      options:
        - Installation
        - CLI commands
        - Slash commands
        - Workflow
        - Cloud providers
        - AI agents
        - Not sure
        - Other
    validations:
      required: false

  - type: dropdown
    id: cloud-provider
    attributes:
      label: Cloud provider specific?
      options:
        - AWS
        - Azure
        - GCP
        - IBM Cloud
        - Oracle Cloud
        - All clouds
        - Not cloud-specific
        - Other
    validations:
      required: false

  - type: textarea
    id: suggested-content
    attributes:
      label: What should be documented?
      placeholder: Would help to explain...
    validations:
      required: false

  - type: textarea
    id: examples
    attributes:
      label: Example or suggestion
      placeholder: Maybe something like...
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      placeholder: Additional context...
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Want to help?
      options:
        - label: I'd be interested in improving the docs
          required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Quick check
      options:
        - label: I searched existing docs and issues
          required: false
        - label: I'll be respectful and constructive
          required: true
